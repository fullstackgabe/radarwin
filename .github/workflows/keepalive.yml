name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://dlluaekaopnftgtakhzw.supabase.co
          SUPABASE_KEY: sb_publishable_1ER26eEM-GHMLEW-AEgCqw_OlGbzDp1
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 15 --retry-all-errors "$SUPABASE_URL/rest/v1/event_types?select=code&limit=1" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" || echo "000")
          echo "Supabase respondeu HTTP $code"
          test "$code" = "200"
